name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.x"

      - name: Generate C# from schemas
        run: dotnet run --project tools/SchemaGen --configuration Release

      - name: Build
        run: dotnet build Osdu.Schemas.slnx --configuration Release

      - name: Fetch OSDU example payloads (best-effort)
        continue-on-error: true
        run: |
          # Round-trip tests validate against canonical OSDU example payloads,
          # expected at ../data-definitions/Examples (sibling checkout). Fetch
          # just the Examples tree via a shallow sparse clone; if it fails, the
          # example-based tests skip and only generation + import are checked.
          git clone --depth 1 --filter=blob:none --sparse \
            https://community.opengroup.org/osdu/data/data-definitions.git \
            ../data-definitions
          git -C ../data-definitions sparse-checkout set Examples

      - name: Test
        run: dotnet test Osdu.Schemas.slnx --configuration Release --no-build --logger "console;verbosity=normal"
