name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@8cf05342045a745a619bce94b04f235051a2a068 # v9.38.4
    with:
      message: ${{ github.event.pull_request.title }}
